{% extends 'main/base.html' %}

{% block title %}SkyBoard - Delete Flight{% endblock %}

{% block content %}
<h2>Delete Flight</h2>
<div class="card">
    <div class="card-body">
        <p>Are you sure you want to delete the flight <strong>{{ flight.flight_number }}</strong> ({{ flight.origin }} to {{ flight.destination }})?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Yes, delete</button>
            <a href="{% url 'flight_list' %}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
