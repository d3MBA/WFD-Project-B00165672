{% extends 'main/base.html' %}

{% block title %}SkyBoard - Delete Supplier{% endblock %}

{% block content %}
<h2>Delete Supplier</h2>
<div class="card">
    <div class="card-body">
        <p>Are you sure you want to delete the supplier <strong>{{ supplier.name }}</strong>?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Yes, delete</button>
            <a href="{% url 'supplier_list' %}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
